<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="[^]건호 주훈 싸울 때도 형이라 부르기야">
  <title>단칸방</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js" defer></script>
  <script src="/vendor/marked.umd.js" defer></script>
  <script src="/markdown.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
<div class="app" id="app">

  <!-- ① 서버 목록 -->
  <nav class="servers" aria-label="서버">
    <button class="server selected" id="server-home" data-tip="건호 · 주훈" aria-label="건호 · 주훈 서버">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h8a5 5 0 0 1 5 5v3a3 3 0 0 1-3 3h-1l-2 3-2-3h-2l-2 3-2-3H6a3 3 0 0 1-3-3v-3a5 5 0 0 1 5-5Z"/><circle cx="8.5" cy="11.5" r="1"/><circle cx="15.5" cy="11.5" r="1"/></svg>
    </button>
    <span class="server-sep"></span>
  </nav>

  <!-- ② 채널 목록 -->
  <aside class="sidebar" id="sidebar">
    <header class="server-header"><b id="server-name">건호 · 주훈</b></header>
    <div class="channel-scroll">
      <section class="category" data-category>
        <button class="category-toggle" aria-expanded="true"><i data-icon="chevron"></i>텍스트 채널</button>
        <nav class="category-items" id="text-channels" aria-label="텍스트 채널"></nav>
      </section>

      <section class="category" data-category>
        <button class="category-toggle" aria-expanded="true"><i data-icon="chevron"></i>음성 채널</button>
        <div class="category-items">
          <button class="channel" data-channel="voice"><i data-icon="speaker"></i><span class="channel-label" id="voice-label">라운지</span></button>
          <div class="voice-members" id="voice-members"></div>
        </div>
      </section>

      <section class="category" data-category>
        <button class="category-toggle" aria-expanded="true"><i data-icon="chevron"></i>공개</button>
        <div class="category-items">
          <button class="channel" data-channel="guestbook"><i data-icon="chat"></i><span class="channel-label" id="guestbook-label">방명록</span></button>
        </div>
      </section>
    </div>

    <footer class="user-panel">
      <button class="user-chip" id="profile-switch" aria-label="작성 프로필 전환">
        <span class="avatar-wrap"><span class="avatar" id="self-avatar"></span><span class="status-dot"></span></span>
        <span class="user-chip-text"><b id="self-name">건호</b><small id="self-role">온라인</small></span>
      </button>
      <button class="icon-btn" id="profile-switch-2" data-tip="프로필 전환" aria-label="프로필 전환"><i data-icon="swap"></i></button>
      <button class="icon-btn" id="profile-settings-open" data-tip="프로필 사진 설정" aria-label="프로필 사진 설정"><i data-icon="gear"></i></button>
    </footer>
  </aside>

  <!-- ③ 대화 -->
  <main class="main">
    <header class="chat-header">
      <button class="icon-btn mobile-only" id="menu" aria-label="채널 메뉴"><i data-icon="menu"></i></button>
      <i class="header-icon" id="channel-icon" data-icon="hash"></i>
      <h1 id="channel-name">일기</h1>
      <span class="header-divider"></span>
      <span class="topic" id="channel-topic"></span>
      <div class="header-tools">
        <button class="icon-btn" id="pins-open" data-tip="고정된 메시지" aria-label="고정된 메시지"><i data-icon="pin"></i></button>
        <button class="icon-btn" id="guest-link" data-tip="방명록 주소 복사" aria-label="방명록 주소 복사"><i data-icon="link"></i></button>
        <button class="icon-btn" id="members-toggle" data-tip="멤버 목록" aria-label="멤버 목록" aria-pressed="true"><i data-icon="members"></i></button>
        <label class="search">
          <input id="search" type="search" placeholder="검색하기" aria-label="메시지 검색" autocomplete="off">
          <i data-icon="search"></i>
        </label>
      </div>
    </header>

    <div class="content">
      <div class="chat">
        <div class="status" id="status" role="status"></div>
        <div class="search-note" id="search-note" hidden></div>

        <section class="feed" id="feed" aria-label="채팅 기록">
          <button id="load-more" class="load-more" hidden>이전 메시지 불러오기</button>
          <div id="messages"></div>
        </section>

        <section class="voice-stage" id="voice-stage" hidden>
          <div class="voice-tiles" id="voice-tiles"></div>
          <div class="voice-controls">
            <button class="voice-btn" id="voice-toggle" aria-pressed="false"><i data-icon="pause"></i><span>애니메이션 멈추기</span></button>
          </div>
          <p class="voice-note">음성 연출 · 실제 통화 연결은 없어요</p>
        </section>

        <form class="composer" id="composer">
          <div class="composer-bar" id="composer-bar" hidden></div>
          <div class="compose-box">
            <div id="attachment-preview" hidden></div>
            <div class="input-row">
              <button type="button" class="compose-btn" id="attach" aria-label="사진 첨부" data-tip="사진 첨부"><i data-icon="plus"></i></button>
              <textarea id="message-input" rows="1" maxlength="5000" placeholder="#일기에 메시지 보내기" aria-label="메시지"></textarea>
              <button type="button" class="compose-btn" id="emoji-open" aria-label="이모지" data-tip="이모지"><i data-icon="smile"></i></button>
              <button type="submit" class="compose-btn send" id="send" aria-label="메시지 보내기"><i data-icon="send"></i></button>
            </div>
          </div>
          <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </form>
      </div>

      <!-- ④ 멤버 목록 -->
      <aside class="members" id="members" aria-label="멤버 목록"></aside>
    </div>
  </main>
  <div class="scrim" id="scrim"></div>
</div>

<!-- 팝오버(이모지·고정 메시지·프로필 카드)와 대화상자 -->
<div class="popover" id="popover" role="dialog" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<dialog id="author-picker">
  <div class="dialog-head"><h2>프로필 전환</h2><button type="button" class="icon-btn" data-close="author-picker" aria-label="닫기"><i data-icon="close"></i></button></div>
  <p class="dialog-sub">누구로 글을 쓸지 골라 주세요.</p>
  <div id="author-options"></div>
  <button type="button" class="link-btn" id="picker-settings">프로필 사진 설정</button>
</dialog>

<dialog id="profile-settings">
  <form id="profile-form">
    <div class="dialog-head"><h2>프로필 사진</h2><button type="button" class="icon-btn" data-close="profile-settings" aria-label="닫기"><i data-icon="close"></i></button></div>
    <p class="dialog-sub">PNG · JPG · WEBP, 5MB 이하. 가운데를 정사각형으로 잘라 저장해요.</p>
    <div id="profile-fields"></div>
    <div class="dialog-actions"><button type="button" class="btn ghost" data-close="profile-settings">취소</button><button type="submit" class="btn primary" id="profile-save">저장</button></div>
  </form>
</dialog>

<dialog id="image-dialog" class="image-dialog">
  <img id="full-image" alt="첨부 사진">
  <button class="icon-btn image-close" data-close="image-dialog" aria-label="닫기"><i data-icon="close"></i></button>
</dialog>

<div id="toast" role="status"></div>
</body>
</html>
