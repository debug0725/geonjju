<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#313338"><meta name="description" content="건호와 주훈의 일기장과 음악"><title>일기장</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/vendor/marked.umd.js" defer></script><script src="/markdown.js" defer></script><script src="/app.js" defer></script></head>
<body>
<div class="app">
<nav class="servers" aria-label="서버"><button class="server selected" data-server="home" aria-label="건호 · 주훈 서버" title="건호 · 주훈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h8a5 5 0 0 1 5 5v3a3 3 0 0 1-3 3h-1l-2 3-2-3h-2l-2 3-2-3H6a3 3 0 0 1-3-3v-3a5 5 0 0 1 5-5Z"/><circle cx="8.5" cy="11.5" r="1"/><circle cx="15.5" cy="11.5" r="1"/></svg></button></nav>
<aside class="sidebar" id="sidebar"><header class="server-header"><span class="server-mark">✦</span><b id="server-name">건호 · 주훈</b></header><div class="channel-group"><p><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>텍스트 채널</p><nav id="channels" aria-label="채널"></nav><div class="voice-group"><p class="group-label">음성 채널</p><button id="voice-nav" class="channel voice-nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5V4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg><span>라운지</span><small>연출</small></button><div class="voice-members" aria-label="건호와 주훈의 음성 대화 애니메이션"><div class="voice-member voice-a"><span class="avatar" data-profile-avatar="건호"></span><span>건호</span><span class="voice-bars"><i></i><i></i><i></i></span></div><div class="voice-member voice-b"><span class="avatar" data-profile-avatar="주훈"></span><span>주훈</span><span class="voice-bars"><i></i><i></i><i></i></span></div></div></div><button id="guestbook-nav" class="guestbook-nav" title="공개 방명록"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H3l2-5A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 9h8M8 13h5"/></svg>방명록</button></div><footer class="user-panel"><button id="profile-switch" class="profile-switch" aria-label="작성 프로필 전환"><span class="avatar" id="self-avatar"></span><span class="identity-copy"><b id="self-name">건호</b><small id="self-role">프로필 전환</small></span><svg class="switch-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9 4 4 4-4"/></svg></button><button id="profile-settings-open" class="icon-button" title="프로필 설정" aria-label="프로필 설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-1h4l1 1 1 3 3 1 2 3-1 3 1 3-2 3-3 1-1 2h-5l-1-2-3-1-2-3 1-3-1-3 2-3 3-1 1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></footer></aside>
<main class="main"><header class="chat-header"><button id="menu" class="icon-button" aria-label="채널 메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><svg class="hash" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-4 18M18 3l-4 18M4 9h17M2 15h17"/></svg><b id="channel-name">일기</b><span id="channel-access" class="access" hidden></span><div class="header-controls"><button id="guest-link" class="icon-button" title="방명록 주소 복사" aria-label="방명록 주소 복사"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></svg></button></div></header>
<div class="status" id="status" role="status"></div>
<section class="feed" id="feed" aria-label="채팅 기록"><button id="load-more" class="load-more" hidden>이전 메시지</button><div id="messages"></div></section>
<section class="voice-stage" id="voice-stage" hidden><div class="voice-stage-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5V4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg><h1>라운지</h1></div><div class="voice-tiles"><div class="voice-tile voice-a"><span class="avatar" data-profile-avatar="건호"></span><b>건호</b><span class="voice-bars"><i></i><i></i><i></i></span></div><div class="voice-tile voice-b"><span class="avatar" data-profile-avatar="주훈"></span><b>주훈</b><span class="voice-bars"><i></i><i></i><i></i></span></div></div><button id="voice-toggle" class="voice-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg><span>애니메이션 일시정지</span></button><p class="voice-disclosure">음성 연출 · 실제 통화 연결 없음</p></section><section class="composer-area"><form id="composer"><div class="composer-meta"><label id="visitor-field" hidden>닉네임 <input id="visitor-name" maxlength="24" placeholder="방문자" autocomplete="nickname"></label><span class="edit-note" id="edit-note" hidden>수정 중 <button type="button" id="cancel-edit">취소</button></span></div><div class="compose-box"><div id="attachment-preview" hidden></div><div class="input-row"><button type="button" id="attach" class="attach" aria-label="사진 첨부"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button><textarea id="message-input" rows="1" maxlength="5000" placeholder="#일기에 메시지 보내기" aria-label="메시지"></textarea><button type="submit" id="send" title="보내기" aria-label="메시지 보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 19 9-19 9 4-9-4-9ZM7 12h15"/></svg></button></div></div><input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></form></section></main></div>
<dialog id="author-picker" class="author-picker"><div class="dialog-heading"><h2>프로필 전환</h2><button type="button" data-close="author-picker" aria-label="닫기">×</button></div><div id="author-options"></div><button id="picker-settings" class="picker-settings">프로필 사진 설정</button></dialog><dialog id="profile-settings"><form id="profile-form"><div class="dialog-heading"><h2>프로필 사진</h2><button type="button" data-close="profile-settings" aria-label="닫기">×</button></div><div id="profile-fields"></div><p class="profile-hint">PNG · JPG · WEBP / 5MB 이하</p><button type="submit" class="primary" id="profile-save">저장</button></form></dialog>
<dialog id="image-dialog"><button class="close" data-close="image-dialog" aria-label="닫기">×</button><img id="full-image" alt="첨부 사진"></dialog><div id="toast" role="status"></div>
</body></html>
